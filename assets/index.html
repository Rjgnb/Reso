<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Pro - 极致工艺全功能版</title>
    <style>
        :root {
            --cell-size: 38px;
            --bg-color: #eef2f6;
            --panel-bg: #ffffff;
            --text-color: #2c3e50;
            --board-color: #e3b35b;
            --line-color: rgba(40, 30, 10, 0.85);
            --accent: #2563eb;
            --black-stone: radial-gradient(circle at 30% 30%, #555, #111 85%);
            --white-stone: radial-gradient(circle at 30% 30%, #ffffff 0%, #f0f0f0 60%, #ccc 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .app-layout {
            display: grid;
            grid-template-columns: 300px auto 340px;  /* 左：玩家区 | 中：棋盘 | 右：AI区 */
            gap: 24px;
            padding: 20px;
            min-height: 100vh;
            align-items: center;  /* 顶部对齐 */
            justify-content: center;
        }
        .board-outer {
            display: grid; grid-template-columns: 32px auto; grid-template-rows: auto 32px;
            background: var(--board-color);
            padding: 25px; border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 0 1px rgba(0,0,0,0.2), inset 0 0 100px rgba(0,0,0,0.1);
            border-bottom: 5px solid #b38843; border-right: 5px solid #b38843;

            align-items: center;
            justify-items: center;

            width: fit-content;     /* 不允许横向拉伸 */
            height: fit-content;    /* 不允许纵向拉伸，只用自身高度 */
            justify-self: center;   /* 可选：水平也居中，让整体更美观 */
        }

        .axis-y, .axis-x { font-weight: 600; color: var(--line-color); font-size: 13px; opacity: 0.7; }
        .axis-y { display: flex; flex-direction: column; justify-content: space-around; align-items: center;height: calc(19 * (var(--cell-size))); /* 与棋盘等高 */
     /* 上下各留半格空间 */grid-column: 1;
    grid-row: 1; }
        .axis-x { grid-column: 2; display: flex; justify-content: space-around; width: calc(19 * var(--cell-size)); /* 与棋盘等宽 */ /* 左右各留半格空间 */
    height: 32px;
    align-items: center;}

        /* 确保坐标轴字符与交叉点对齐 */
.axis-y > div {
    width: 100%;
    text-align: center;
    /* 每个数字对应一行的高度 */
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 调整位置，使其与网格线对齐 */
    transform: translateY(-2px); /* 微调垂直位置 */
}

.axis-x > div {
    /* 每个字母对应一列的宽度 */
    flex: 1;
    text-align: center;
    /* 调整位置，使其与网格线对齐 */
    transform: translateX(-1px); /* 微调水平位置 */
}

        .board-container { position: relative; }
        .go-grid { display: grid; grid-template-columns: repeat(19, var(--cell-size)); grid-template-rows: repeat(19, var(--cell-size)); }

        .cell { position: relative; width: var(--cell-size); height: var(--cell-size); cursor: pointer;  overflow: visible;}
        .cell::before, .cell::after { content: ""; position: absolute; background: var(--line-color); pointer-events: none; }
        .cell::before { width: 100%; height: 1.2px; top: 50%; left: 0; transform: translateY(-50%); }
        .cell::after { height: 100%; width: 1.2px; left: 50%; top: 0; transform: translateX(-50%); }
        .row-0.cell::after { top:50%}
        .row-18.cell::after {height: 50%}
        .col-0.cell::before {left: 50%}
        .col-18.cell::before {width: 50%}

        .cell.hoshi::before {
            content: ""; position: absolute; width: 8px; height: 8px; background: var(--line-color);
            border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
        }

        .stone {
            position: absolute; width: 94%; height: 94%; left: 3%; top: 3%;
            border-radius: 50%; box-shadow: 2px 4px 8px rgba(0,0,0,0.5);
            z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; transition: opacity 0.2s;
        }
        .stone.black { background: var(--black-stone); color: #fff; }
        .stone.white { background: var(--white-stone); color: #333; border: 0.5px solid rgba(0,0,0,0.2); }
        .stone.ghost { opacity: 0.45; transform: scale(0.92); box-shadow: 0 0 15px rgba(255,255,255,0.3); z-index: 5; }
        .stone.last-move::after {
            content: ""; position: absolute; width: 10px; height: 10px;
            background: #ff3b30; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px rgba(255,0,0,0.5);
        }

        @keyframes stoneDrop { from { transform: scale(1.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .stone.new-move { animation: stoneDrop 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.2); }

        .sidebar { display: flex; flex-direction: column; gap: 24px; }
        .card {
            background: linear-gradient(145deg, #ffffff, #f9fafb);
            padding: 24px; border-radius: 28px;
            box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
            border: 1px solid rgba(255,255,255,0.8);
        }

        .player-header { display: flex; align-items: center; gap: 20px; }
        .big-stone-icon { width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 8px 20px rgba(0,0,0,0.25); border: 2px solid transparent; transition: 0.3s; }
        .big-stone-icon.black { background: var(--black-stone); }
        .big-stone-icon.white { background: var(--white-stone); border: 1px solid #ddd; }
        .active .big-stone-icon { border-color: var(--accent); box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .player-title { font-size: 32px; font-weight: 900; color: #1e293b; opacity: 0.15; transition: 0.3s; }
        .active .player-title { opacity: 1; color: var(--accent); }

        .segmented-control { background: #e2e8f0; padding: 4px; border-radius: 14px; position: relative; margin-top: 15px; display: flex; }
        .segmented-control input { display: none; }
        .segmented-control label { flex: 1; text-align: center; padding: 12px; font-size: 15px; cursor: pointer; z-index: 1; color: #64748b; font-weight: 700; }
        .segmented-control input:checked + label { color: white; }
        .selection-glider { position: absolute; height: calc(100% - 8px); width: calc(50% - 4px); background: var(--accent); left: 4px; border-radius: 10px; transition: 0.3s cubic-bezier(0.65, 0, 0.35, 1); }
        #p1-ai:checked ~ .selection-glider, #p2-ai:checked ~ .selection-glider { transform: translateX(100%); }

        .nav-row { display: flex; justify-content: center; gap: 10px; margin: 25px 0; align-items: center; }
        .nav-btn { display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #e2e8f0; width: 48px; height: 48px; border-radius: 16px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .nav-btn:hover { background: var(--accent); color: #fff; transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .nav-btn:hover svg { stroke: #fff; transform: scale(1.1); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .btn { border: none; padding: 16px; border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-outline { background: #f1f5f9; color: #475569; }
        .btn-outline:hover { background: #e2e8f0; }
        .btn-outline.active { background: #e1edff; color: var(--accent); border: 1px solid var(--accent); }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 10px 25px rgba(37,99,235,0.3); }

        .ai-log-content { background: #ffffff; padding: 22px; border-radius: 20px; min-height: 150px;max-height: 400px; overflow-y: auto;
            font-size: 15px; line-height: 1.8; border: 1px solid #e2e8f0; margin-top: 15px; color: #334155; scrollbar-width: thin;          /* Firefox */
            scrollbar-color: #cbd5e1 #f8fafc;}

        .new-game-bar {
            text-align: left;
        }

        .new-game-btn {
            width: 100%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: white;
        }

        .new-game-btn:hover {
            opacity: 0.9;
        }
        .status-log {
            padding: 6px 10px;
            font-size: 15px;
            color: #666;
            border-top: 1px solid #e5e5e5;
            min-height: 20px;
            user-select: none;
            flex-shrink: 0;
        }

                /* 左侧玩家面板 */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-card {
            height: fit-content;
        }

        /* 右侧AI面板 */
        .right-panel {
            display: flex;
            flex-direction: column;
            height:fit-content;
            gap: 24px;
        }

        .ai-card {
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .ai-log-content {
            flex: 1;                  /* 在AI卡片内也拉长 */
            min-height: 200px;
            max-height: 60vh;      /* 可选：最多占视口60%，防止在超长分析时过高 */
            overflow-y: auto;         /* 内容多时滚动 */
            margin-top: 15px;
            padding: 22px;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        .score-display {
            background: linear-gradient(145deg, #ffffff, #f9fafb);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
            border: 1px solid rgba(255,255,255,0.8);
            text-align: center;
        }

        #score-info {
            font-size: 26px;
            font-weight: 900;
            color: #1e293b;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(37, 99, 235, 0.05);
            border-radius: 16px;
            border: 2px dashed rgba(37, 99, 235, 0.2);
            transition: all 0.3s;
        }

        /* 当有真实分数时，可以去掉虚线边框（通过JS控制） */
        #score-info.has-score {
            border-style: solid;
            border-color: var(--accent);
            background: rgba(37, 99, 235, 0.1);
        }

        @media (max-width: 1280px) {
            .app-layout {
                grid-template-columns: 1fr;
                align-items: center;
                justify-items: center;
            }
            .left-panel, .right-panel {
                width: 100%;
                max-width: 420px;
            }
            .right-panel {
                height: auto;
            }
            .status-log {
                margin-top: 20px;
            }
        }

    </style>
</head>
<body>

    <div class="app-layout">
        <!-- 左侧：新对局 + 玩家设置 -->
        <div class="left-panel">
            <div class="new-game-bar">
                <button class="new-game-btn" onclick="startNewGame()">
                    🆕 新对局
                </button>
            </div>

            <div class="card player-card">
                <div class="player-section active" id="section-p1" style="margin-bottom: 30px;">
                    <div class="player-header"><div class="big-stone-icon black"></div><h2 class="player-title">黑棋</h2></div>
                    <div class="segmented-control">
                        <input type="radio" name="p1-t" id="p1-human" checked onchange="checkAiTurn()"><label for="p1-human">人类</label>
                        <input type="radio" name="p1-t" id="p1-ai" onchange="checkAiTurn()"><label for="p1-ai">KataGo</label>
                        <div class="selection-glider"></div>
                    </div>
                </div>
                <div class="player-section" id="section-p2">
                    <div class="player-header"><div class="big-stone-icon white"></div><h2 class="player-title">白棋</h2></div>
                    <div class="segmented-control">
                        <input type="radio" name="p2-t" id="p2-human" onchange="checkAiTurn()"><label for="p2-human">人类</label>
                        <input type="radio" name="p2-t" id="p2-ai" checked onchange="checkAiTurn()"><label for="p2-ai">KataGo</label>
                        <div class="selection-glider"></div>
                    </div>
                </div>

                <div class="nav-row">
                    <!-- 导航按钮保持不变 -->
                    <button class="nav-btn" onclick="jumpTo(0)" title="回到开局"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 19 2 12 11 5 11 19"></polygon><polygon points="22 19 13 12 22 5 22 19"></polygon></svg></button>
                    <button class="nav-btn" onclick="navigate(-1)" title="后退"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                    <div style="font-weight: 900; width: 80px; text-align: center; font-size: 18px; color: var(--accent);"><span id="cur-v">0</span> / <span id="total-v">0</span></div>
                    <button class="nav-btn" onclick="navigate(1)" title="前进"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
                    <button class="nav-btn" onclick="jumpTo(history.length)" title="回到最新"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon></svg></button>
                </div>

                <div class="btn-grid">
                    <button class="btn btn-outline" onclick="undo()">悔棋</button>
                    <button class="btn btn-outline" id="btn-num" onclick="toggleNumbers()">显示手数</button>

                    <!-- 领地渲染:TODO -->
                    <button class="btn btn-outline" style="grid-column: span 2" onclick="toggleTerritory()">KataGo:5级</button>
                </div>
            </div>
        </div>

        <!-- 中间：棋盘 -->
        <div class="board-outer">
            <div class="axis-y" id="axis-y"></div>
            <div class="board-container">
                <div id="board" class="go-grid"></div>
            </div>
            <div class="axis-x" id="axis-x"></div>
        </div>

        <!-- 右侧：AI老师 + 底部状态栏 -->
        <div class="right-panel">
            <div class="score-display">
                <h3 style="font-size: 20px; font-weight:400; color: #0f172a; margin-bottom: 8px;">当前分数</h3>
                <div id="score-info" style="font-size: 24px; font-weight: bold; color: var(--accent); text-align: center; padding: 20px; background: rgba(37, 99, 235, 0.08); border-radius: 16px;">
                    暂无估分
                </div>
            </div>
            <div class="card ai-card">
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <h3 style="font-size: 20px; font-weight: 900; color: #0f172a;">棋待诏</h3>
                    <button class="btn btn-primary" style="padding: 10px 20px" onclick="requestAnalysis()">为朕解此枰上风云</button>
                </div>
                <div id="ai-log" class="ai-log-content">等待落子分析...</div>
            </div>

            <!-- 状态栏固定在整个页面底部 -->
            <div class="status-log" id="status-log">
                状态：就绪
            </div>
        </div>
    </div>

    <script src = "GO.js"></script>
</body>
</html>
